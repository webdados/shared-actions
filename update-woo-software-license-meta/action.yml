name: Update Woo Software License Meta
description: Update WooCommerce "WP Software License " product meta data - version, last updates, version required, and tested up to

inputs:
  plugin-filename:
    description: 'The main file of the plugin - Main plugin filename without the .php extension - Only of the main plugin file is not the same as the slug (folder name)'
    default: ''
  plugin-version:
    description: 'The version of the plugin to update - Defaults to github.ref_name (the tag name)'
    default: ''
  plugin-product-ids:
    description: 'The WooCommerce Product ID to update the meta data for'
    required: true
  woo-consumer-key:
    description: 'WooCommerce REST API Consumer Key with write permissions'
    required: true
  woo-consumer-secret:
    description: 'WooCommerce REST API Consumer Secret with write permissions'
    required: true
  woo-store-url:
    description: 'The URL of the WooCommerce store (e.g. https://nakedcatplugins.com)'
    required: true

runs:
  using: 'composite'
  steps:
    - name: 📝 Update WooCommerce Products
      shell: bash
      run: |
        INPUT_FILENAME="${{ inputs.plugin-filename }}"
        FILENAME="${INPUT_FILENAME:-$SLUG}"
        INPUT_VERSION="${{ inputs.plugin-version }}"
        REF_NAME="${{ github.ref_name }}"
        VERSION="${INPUT_VERSION:-$REF_NAME}"
        CURRENT_DATE=$(date +%Y-%m-%d)
        CONSUMER_KEY="${{ inputs.woo-consumer-key }}"
        CONSUMER_SECRET="${{ inputs.woo-consumer-secret }}"
        
        # List of product IDs to update (space-separated)
        PRODUCT_IDS="${{ inputs.plugin-product-ids }}"

        # WP Required and Tested up to versions
        MAIN_PLUGIN_FILE="$FILENAME.php"
        REQUIRES_AT_LEAST=$(
          awk '/^[[:space:]]*\*[[:space:]]*Requires at least:/{
            sub(/^[^:]*:[[:space:]]*/, "", $0)
            gsub(/^[[:space:]]+|[[:space:]]+$/, "", $0)
            print; exit
          }' "$MAIN_PLUGIN_FILE"
        )

        TESTED_UP_TO=$(
          awk '/^[[:space:]]*\*[[:space:]]*Tested up to:/{
            sub(/^[^:]*:[[:space:]]*/, "", $0)
            gsub(/^[[:space:]]+|[[:space:]]+$/, "", $0)
            print; exit
          }' "$MAIN_PLUGIN_FILE"
        )
        
        # Other plugins this release needs, from " * Naked Cat Requires: shop-as-client 8.6, other 2.0"
        # (folder name and minimum version, comma separated), as JSON for the store, which adds it to
        # the update answer so the Naked Cat Plugins SDK only offers the update once a site has them.
        # Always written, so a release without the header clears what an earlier one needed.
        REQUIRES_PLUGINS_HEADER=$(
          awk '/^[[:space:]]*\*[[:space:]]*Naked Cat Requires:/{
            sub(/^[^:]*:[[:space:]]*/, "", $0)
            gsub(/^[[:space:]]+|[[:space:]]+$/, "", $0)
            print; exit
          }' "$MAIN_PLUGIN_FILE"
        )
        REQUIRES_PLUGINS=$(
          printf '%s' "$REQUIRES_PLUGINS_HEADER" | tr ',' '\n' | jq -R -s -c '
            [ split("\n")[] | gsub("^\\s+|\\s+$"; "") | select(length > 0) | split(" ") | map(select(length > 0)) ]
            | if any(.[]; length != 2) then error("Naked Cat Requires: each entry must be a plugin folder name and a version") else . end
            | map({ (.[0]): .[1] }) | add // {}
            | if . == {} then "" else tojson end'
        ) || { echo "::error::Unreadable Naked Cat Requires header: $REQUIRES_PLUGINS_HEADER"; exit 1; }
        REQUIRES_PLUGINS=$(printf '%s' "$REQUIRES_PLUGINS" | jq -r .)

        echo "Updating products in WooCommerce with version: $VERSION, date: $CURRENT_DATE, requires at least: $REQUIRES_AT_LEAST, tested up to: $TESTED_UP_TO, requires plugins: ${REQUIRES_PLUGINS:-none}"

        PAYLOAD=$(jq -n -c \
          --arg version "$VERSION" \
          --arg date "$CURRENT_DATE" \
          --arg requires "$REQUIRES_AT_LEAST" \
          --arg tested "$TESTED_UP_TO" \
          --arg requires_plugins "$REQUIRES_PLUGINS" \
          '{ meta_data: [
              { key: "_sl_new_version", value: $version },
              { key: "_sl_last_updated", value: $date },
              { key: "_sl_version_required", value: $requires },
              { key: "_sl_tested_up_to", value: $tested },
              { key: "_nakedcat_requires_plugins", value: $requires_plugins }
            ] }')

        FAILED_PRODUCTS=""
        for PRODUCT_ID in $PRODUCT_IDS; do
          echo "Updating product ID: $PRODUCT_ID"

          HTTP_CODE=$(curl -s -o "$RUNNER_TEMP/product-response.json" -w '%{http_code}' \
            -X PUT "${{ inputs.woo-store-url }}/wp-json/wc/v3/products/$PRODUCT_ID" \
            -u "$CONSUMER_KEY:$CONSUMER_SECRET" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD") || HTTP_CODE=000

          # A refused key or a missing product comes back as a 4xx with a JSON code and message,
          # which used to leave the step green. Try every product, then fail if any was refused.
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ] || ! jq -e '.id' "$RUNNER_TEMP/product-response.json" >/dev/null 2>&1; then
            echo "::error::Product $PRODUCT_ID was not updated (HTTP $HTTP_CODE): $(jq -r '"\(.code // "no code"): \(.message // "no message")"' "$RUNNER_TEMP/product-response.json" 2>/dev/null || head -c 300 "$RUNNER_TEMP/product-response.json")"
            FAILED_PRODUCTS="$FAILED_PRODUCTS $PRODUCT_ID"
          else
            echo "Product $PRODUCT_ID updated"
          fi
        done

        if [ -n "$FAILED_PRODUCTS" ]; then
          echo "::error::Products not updated:$FAILED_PRODUCTS"
          exit 1
        fi
