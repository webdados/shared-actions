name: Update WP Documentation page
description: Convert DOCUMENTATION.md to HTML and update WordPress page content with it

inputs:
  documentation-page-id:
    description: 'The WordPress page ID to update with the documentation content'
    required: true
  documentation-file:
    description: 'The path to the DOCUMENTATION.md file to convert and upload'
    default: 'DOCUMENTATION.md'
  plugin-name:
    description: 'The name of the plugin to update, for the back to product link'
    required: true
  plugin-url:
    description: 'The public URL of the plugin to update, for the back to product link'
    required: true
  wordpress-user:
    description: 'WordPress REST API user with write permissions'
    required: true
  wordpress-password:
    description: 'WordPress REST API user password with write permissions'
    required: true
  woo-store-url:
    description: 'The URL of the WooCommerce store (e.g. https://nakedcatplugins.com)'
    required: true

runs:
  using: 'composite'
  steps:
    - name: 📄 Update Documentation Page
      shell: bash
      run: |
        WORDPRESS_USER="${{ inputs.wordpress-user }}"
        WORDPRESS_PASSWORD="${{ inputs.wordpress-password }}"
        PAGE_ID="${{ inputs.documentation-page-id }}"
        PRODUCT_NAME="${{ inputs.plugin-name }}"
        PRODUCT_URL="${{ inputs.plugin-url }}"
        DOC_FILE="${{ inputs.documentation-file }}"

        echo "Converting DOCUMENTATION.md to HTML..."

        # Install pandoc for markdown conversion
        sudo apt-get install -y pandoc

        # Extract the hostname from woo-store-url for use in the Lua filter
        STORE_DOMAIN=$(echo "${{ inputs.woo-store-url }}" | sed -E 's|https?://([^/]+).*|\1|')

        # Copy the Lua filter from the action directory
        cp "${{ github.action_path }}/external_links.lua" ./

        # Detect an intro paragraph: any content before the first Markdown heading.
        # If the file starts with a heading, there's no intro and behaviour is unchanged.
        HAS_INTRO="false"
        FIRST_NONBLANK_LINE=$(grep -m1 -n '[^[:space:]]' "$DOC_FILE" | cut -d: -f2-)
        HEADING_LINE_NUM=$(grep -n '^#' "$DOC_FILE" | head -1 | cut -d: -f1)

        if [ -n "$HEADING_LINE_NUM" ] && [[ "$FIRST_NONBLANK_LINE" != \#* ]]; then
          HAS_INTRO="true"
          HEADING_LINE_NUM_MINUS_1=$((HEADING_LINE_NUM - 1))
          sed -n "1,${HEADING_LINE_NUM_MINUS_1}p" "$DOC_FILE" > intro.md
          sed -n "${HEADING_LINE_NUM},\$p" "$DOC_FILE" > content.md
          CONTENT_FILE="content.md"
        else
          CONTENT_FILE="$DOC_FILE"
        fi

        # Convert the main content (from the first heading onward, or the whole
        # file if there's no intro) to HTML
        STORE_DOMAIN="$STORE_DOMAIN" \
        pandoc "$CONTENT_FILE" \
            -f markdown-auto_identifiers \
            -t html \
            --wrap=none \
            --lua-filter=external_links.lua \
            -o documentation.html

        EXCERPT_TEXT=""
        if [ "$HAS_INTRO" = "true" ]; then
          # Convert the intro block to HTML, to render above the table of contents
          STORE_DOMAIN="$STORE_DOMAIN" \
          pandoc intro.md \
              -f markdown-auto_identifiers \
              -t html \
              --wrap=none \
              --lua-filter=external_links.lua \
              -o intro.html

          # Use the last paragraph of the intro block (the actual description,
          # after any disclaimers) as plain text for the post excerpt - no HTML
          # or Markdown syntax.
          awk 'BEGIN{RS=""} {p=$0} END{print p}' intro.md > intro_excerpt.md
          pandoc intro_excerpt.md -f markdown-auto_identifiers -t plain --wrap=none -o intro_excerpt.txt
          EXCERPT_TEXT=$(tr '\n' ' ' < intro_excerpt.txt | sed -E 's/ +/ /g; s/^ //; s/ $//')
        fi

        # Extract FAQ Question/Answer pairs for FAQPage schema: any level-3
        # heading that ends in "?" is treated as a question, its answer is
        # everything up to the next level-1/2/3 heading (nested level-4+
        # headings, if any, stay part of the answer). Stored as page meta
        # (not inlined as a <script> tag) so a separate site-level process
        # can read it and render the actual FAQPage/Question/Answer schema,
        # alongside whatever else it links (about/relatedLink/etc).
        TOTAL_LINES=$(wc -l < "$DOC_FILE")
        mapfile -t HEADING_LINES < <(grep -n '^#\{1,3\}[[:space:]]' "$DOC_FILE" | cut -d: -f1)
        HEADING_LINES+=("$((TOTAL_LINES + 1))")

        FAQ_JSON="[]"
        for i in "${!HEADING_LINES[@]}"; do
          LINE_NUM="${HEADING_LINES[$i]}"
          [ "$LINE_NUM" -gt "$TOTAL_LINES" ] && continue

          HEADING_TEXT=$(sed -n "${LINE_NUM}p" "$DOC_FILE")
          if [[ "$HEADING_TEXT" =~ ^###[[:space:]]+.*\?[[:space:]]*$ ]]; then
            QUESTION=$(echo "$HEADING_TEXT" | sed -E 's/^###[[:space:]]+//; s/[[:space:]]+$//')
            NEXT_LINE_NUM="${HEADING_LINES[$((i + 1))]}"
            ANSWER_START=$((LINE_NUM + 1))
            ANSWER_END=$((NEXT_LINE_NUM - 1))

            if [ "$ANSWER_END" -ge "$ANSWER_START" ]; then
              sed -n "${ANSWER_START},${ANSWER_END}p" "$DOC_FILE" > faq_answer.md
              STORE_DOMAIN="$STORE_DOMAIN" \
              pandoc faq_answer.md -f markdown-auto_identifiers -t html --wrap=none --lua-filter=external_links.lua -o faq_answer.html
              ANSWER_HTML=$(cat faq_answer.html)
              FAQ_JSON=$(jq --arg q "$QUESTION" --arg a "$ANSWER_HTML" '. + [{"name": $q, "text": $a}]' <<< "$FAQ_JSON")
            fi
          fi
        done
        FAQ_COUNT=$(jq 'length' <<< "$FAQ_JSON")
        echo "Found $FAQ_COUNT FAQ question(s)"

        # Assemble the final HTML: back-link nav, intro (if any), table of
        # contents, then the main content
        {
          echo "<nav aria-label=\"Back to product\"><p class=\"small\"><strong>Back to <a href=\"$PRODUCT_URL\">$PRODUCT_NAME</a></strong></p></nav>"
          echo ""
          if [ "$HAS_INTRO" = "true" ]; then
            cat intro.html
            echo ""
          fi
          echo "[ez-toc]"
          echo ""
          cat documentation.html
        } > documentation_with_header.html

        echo "Updating WordPress page..."

        # NOTHING BIG GOES THROUGH argv, not to curl and not to jq either.
        #
        # Linux caps a SINGLE argv entry at 128 KB (MAX_ARG_STRLEN), whatever the much
        # larger ARG_MAX says, and both of the big values here are past that on a plugin
        # with long documentation: the page HTML, and every FAQ answer a second time
        # inside the schema meta. Sending the finished payload to curl from a file was
        # only half of it, because jq was still being handed the same strings with
        # --arg/--argjson to build that payload, and died first with
        # "jq: Argument list too long" while the page was silently never updated.
        #
        # So the payload is assembled in one jq call that reads the large values from
        # files with --rawfile. Keep it that way: any --arg here must stay small.
        JQ_ARGS=(-n --rawfile content documentation_with_header.html)
        JQ_FILTER='{content: $content, template: "template-documentation.php"}'

        if [ -n "$EXCERPT_TEXT" ]; then
          JQ_ARGS+=(--arg excerpt "$EXCERPT_TEXT")
          JQ_FILTER="$JQ_FILTER + {excerpt: \$excerpt}"
        fi

        # Store the FAQ Question/Answer pairs (if any) as a page meta field,
        # JSON-encoded as a string. Site-level code reads meta.nakedcat_faq_schema_questions
        # and renders the FAQPage schema from it - this action does not output
        # any schema itself.
        #
        # -j so the file holds the JSON and no trailing newline: --rawfile takes the file
        # byte for byte, and a newline on the end would be stored inside the meta string.
        if [ "$FAQ_COUNT" -gt 0 ]; then
          printf '%s' "$FAQ_JSON" | jq -cj . > faq_questions.json
          JQ_ARGS+=(--rawfile faq faq_questions.json)
          JQ_FILTER="$JQ_FILTER + {meta: {nakedcat_faq_schema_questions: \$faq}}"
        fi

        jq "${JQ_ARGS[@]}" "$JQ_FILTER" > "$RUNNER_TEMP/documentation-payload.json"

        HTTP_CODE=$(curl -s -o "$RUNNER_TEMP/documentation-response.json" -w '%{http_code}' \
          -X POST "${{ inputs.woo-store-url }}/wp-json/wp/v2/pages/$PAGE_ID" \
          -u "$WORDPRESS_USER:$WORDPRESS_PASSWORD" \
          -H "Content-Type: application/json" \
          -d @"$RUNNER_TEMP/documentation-payload.json") || HTTP_CODE=000

        # WordPress answers errors (a deleted user, a revoked password, a missing page) with a
        # 4xx and a JSON code and message. Without this check the step stayed green and the
        # page silently kept its old content (2026-10-31).
        if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ] || ! jq -e '.id' "$RUNNER_TEMP/documentation-response.json" >/dev/null 2>&1; then
          echo "::error::Documentation page $PAGE_ID was not updated (HTTP $HTTP_CODE): $(jq -r '"\(.code // "no code"): \(.message // "no message")"' "$RUNNER_TEMP/documentation-response.json" 2>/dev/null || head -c 300 "$RUNNER_TEMP/documentation-response.json")"
          exit 1
        fi

        echo "Documentation page $PAGE_ID updated, modified $(jq -r '.modified_gmt' "$RUNNER_TEMP/documentation-response.json") UTC"
