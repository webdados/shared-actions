name: Generate Pot File
description: Regenerate a plugin's .pot file from its PHP/JS/block.json source via WP-CLI's `wp i18n make-pot`, so the file is always current (in the release ZIP, and for any downstream GlotPress sync), even if it wasn't regenerated locally before tagging a release

inputs:
  pot-file:
    description: 'The path to write the .pot file to, relative to the plugin folder (e.g. languages/my-plugin.pot)'
    required: true
  source:
    description: 'The directory to scan for translatable strings, relative to the plugin folder. The plugin main file inside it is used to auto-detect the text domain, so a plugin that intentionally reuses a parent/core text domain for some strings (e.g. a PRO add-on sharing labels with its Free plugin) correctly keeps only its own domain''s strings in its own pot file'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: 🌍 Generate pot file
      shell: bash
      run: |
        POT_FILE="${{ inputs.pot-file }}"
        SOURCE="${{ inputs.source }}"

        mkdir -p "$(dirname "$POT_FILE")"

        composer global require wp-cli/i18n-command

        ~/.composer/vendor/bin/wp i18n make-pot "$SOURCE" "$POT_FILE"

        if [ ! -f "$POT_FILE" ]; then
          echo "::error::Pot file was not generated: $POT_FILE"
          exit 1
        fi

        echo "Pot file generated: $POT_FILE"
