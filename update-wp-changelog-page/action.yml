name: Update WP Changelog page
description: Convert CHANGELOG.md to HTML and update WordPress page content with it

inputs:
  changelog-page-id:
    description: 'The WordPress page ID to update with the changelog content'
    required: true
  changelog-file:
    description: 'The path to the CHANGELOG.md file to convert and upload'
    default: 'CHANGELOG.md'
  plugin-name:
    description: 'The name of the plugin to update, for the back to product link'
    required: true
  plugin-url:
    description: 'The public URL of the plugin to update, for the back to product link'
    required: true
  wordpress-user:
    description: 'WordPress REST API user with write permissions'
    required: true
  wordpress-password:
    description: 'WordPress REST API user password with write permissions'
    required: true
  woo-store-url:
    description: 'The URL of the WooCommerce store (e.g. https://nakedcatplugins.com)'
    required: true

runs:
  using: 'composite'
  steps:
    - name: 📄 Update Changelog Page
      shell: bash
      run: |
        WORDPRESS_USER="${{ inputs.wordpress-user }}"
        WORDPRESS_PASSWORD="${{ inputs.wordpress-password }}"
        PAGE_ID="${{ inputs.changelog-page-id }}"
        PRODUCT_NAME="${{ inputs.plugin-name }}"
        PRODUCT_URL="${{ inputs.plugin-url }}"
        
        echo "Converting CHANGELOG.md to HTML..."

        # Install pandoc for markdown conversion
        sudo apt-get install -y pandoc

        # Extract the hostname from woo-store-url for use in the Lua filter
        STORE_DOMAIN=$(echo "${{ inputs.woo-store-url }}" | sed -E 's|https?://([^/]+).*|\1|')

        # Copy the Lua filter from the action directory
        cp "${{ github.action_path }}/external_links.lua" ./

        # Normalize WordPress.org-style headings (= version - date =) to Markdown h4 (#### version - date)
        sed -E 's/^= (.+) =/#### \1/' "${{ inputs.changelog-file }}" > changelog_preprocessed.md

        # Convert markdown to HTML with smart typography, applying the external-links filter
        STORE_DOMAIN="$STORE_DOMAIN" \
        pandoc changelog_preprocessed.md -f markdown-auto_identifiers -t html --wrap=none --lua-filter=external_links.lua -o changelog.html

        # Add back to product link at the top, wrapped in <nav> so it is identified
        # as navigation rather than page content. Without this a crawler reads
        # "Back to <plugin>" as the opening words of the page, and it lands at the
        # front of any auto-generated meta description.
        echo "<nav aria-label=\"Back to product\"><p class=\"small\"><strong>Back to <a href=\"$PRODUCT_URL\">$PRODUCT_NAME</a></strong></p></nav>" > changelog_with_link.html
        cat changelog.html >> changelog_with_link.html
        
        # Read the HTML content and escape it for JSON
        HTML_CONTENT=$(cat changelog_with_link.html | jq -Rs .)
        
        # A written excerpt, which is what Yoast uses for the meta description when
        # no custom one is set. A changelog has no intro paragraph to extract from,
        # unlike the documentation page, so this is composed from the plugin name
        # the action already receives. Left to itself Yoast scrapes the page body
        # and produces the back link followed by the newest version heading, which
        # describes nothing.
        EXCERPT_TEXT="Changelog for $PRODUCT_NAME: new features, tweaks and fixes in every release, newest first."
        EXCERPT_JSON=$(printf '%s' "$EXCERPT_TEXT" | jq -Rs .)
        PAYLOAD=$(jq -n --argjson content "$HTML_CONTENT" --argjson excerpt "$EXCERPT_JSON" '{content: $content, excerpt: $excerpt}')

        echo "Updating WordPress page..."
        
        # See update-wp-documentation-page: a payload on the command line is capped at
        # 128 KB per argument, and a long-lived plugin's changelog gets there eventually.
        printf '%s' "$PAYLOAD" > "$RUNNER_TEMP/changelog-payload.json"

        HTTP_CODE=$(curl -s -o "$RUNNER_TEMP/changelog-response.json" -w '%{http_code}' \
          -X POST "${{ inputs.woo-store-url }}/wp-json/wp/v2/pages/$PAGE_ID" \
          -u "$WORDPRESS_USER:$WORDPRESS_PASSWORD" \
          -H "Content-Type: application/json" \
          -d @"$RUNNER_TEMP/changelog-payload.json") || HTTP_CODE=000

        # WordPress answers errors (a deleted user, a revoked password, a missing page) with a
        # 4xx and a JSON code and message. Without this check the step stayed green and the
        # page silently kept its old content (2026-10-31).
        if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ] || ! jq -e '.id' "$RUNNER_TEMP/changelog-response.json" >/dev/null 2>&1; then
          echo "::error::Changelog page $PAGE_ID was not updated (HTTP $HTTP_CODE): $(jq -r '"\(.code // "no code"): \(.message // "no message")"' "$RUNNER_TEMP/changelog-response.json" 2>/dev/null || head -c 300 "$RUNNER_TEMP/changelog-response.json")"
          exit 1
        fi

        echo "Changelog page $PAGE_ID updated, modified $(jq -r '.modified_gmt' "$RUNNER_TEMP/changelog-response.json") UTC"
